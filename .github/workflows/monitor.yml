name: DTEK monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dtek-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate configuration
        run: node -e "require('./src/addresses.js'); const u=new URL(process.env.WORKER_URL); if(u.protocol!=='https:'||u.username||u.password||!process.env.WORKER_SECRET)process.exit(1)"
        env:
          DTEK_ADDRESSES_JSON: ${{ secrets.DTEK_ADDRESSES_JSON }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Check DTEK and deliver results to Cloudflare
        run: node src/run-cloud.cjs
        env:
          DTEK_ADDRESSES_JSON: ${{ secrets.DTEK_ADDRESSES_JSON }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
